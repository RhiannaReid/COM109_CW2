<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Halcyon</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/main.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" type="text/css" href="css/styles.css">
    <link rel="stylesheet" type="text/css" href="css/styles-nav.css">
    <link rel="stylesheet" type="text/css" href="css/styles-contact.css">

    <link rel="icon" type="image/png" sizes="50x50" href="images/favicon.png">
    <link href="https://fonts.googleapis.com/css?family=Marcellus" rel="stylesheet">
</head>

<body data-page="contact">
    <div class="top-nav" id="siteHeader"></div>

    <div class="hero-image">
        <div class="hero-text">
            <h1 style="font-size: 8vw;"> Halcyon </h1>
        </div>
    </div>

    <main class="main-content">
        <div class="contact-wrapper">
            <div class="contact-card">
                <div class="contact-header">
                    <h2 class="contact-title">Get In Touch With Halcyon</h2>
                    <p class="contact-subtitle">If you're looking for gig bookings, press inquiries, or just want to say hi, you can find us here.</p>
                </div>

                <div class="contact-section">
                    <h3 class="section-title">Official Social Channels</h3>
                    <div class="contact-social-grid">
                        <a class="contact-social-link" href="https://www.instagram.com/halcyonband/" target="_blank" rel="noreferrer">
                            <i class="fa-brands fa-instagram"></i>
                            <span>Instagram</span>
                        </a>
                        <a class="contact-social-link" href="https://twitter.com/halcyonband" target="_blank" rel="noreferrer">
                            <i class="fa-brands fa-x-twitter"></i>
                            <span>X</span>
                        </a>
                        <a class="contact-social-link" href="https://www.facebook.com/halcyonband" target="_blank" rel="noreferrer">
                            <i class="fa-brands fa-facebook-f"></i>
                            <span>Facebook</span>
                        </a>
                        <a class="contact-social-link" href="https://open.spotify.com/" target="_blank" rel="noreferrer">
                            <i class="fa-brands fa-spotify"></i>
                            <span>Spotify</span>
                        </a>
                        <a class="contact-social-link" href="https://www.ticketmaster.com/" target="_blank" rel="noreferrer">
                            <i class="fa-solid fa-ticket"></i>
                            <span>Tickets</span>
                        </a>
                    </div>
                </div>

                <hr class="section-divider">

                <div class="contact-section">
                    <h3 class="section-title">Direct Contact</h3>
                    <div class="contact-details-grid">
                        <a class="contact-detail-card" href="mailto:info@halcyonband.com">
                            <div class="contact-detail-icon">
                                <i class="fa-solid fa-envelope"></i>
                            </div>
                            <div class="contact-detail-info">
                                <span class="contact-detail-label">Email Us</span>
                                <span class="contact-detail-value">info@halcyonband.com</span>
                            </div>
                        </a>
                        <a class="contact-detail-card" href="tel:+441234567890">
                            <div class="contact-detail-icon">
                                <i class="fa-solid fa-phone"></i>
                            </div>
                            <div class="contact-detail-info">
                                <span class="contact-detail-label">Call Us</span>
                                <span class="contact-detail-value">+44 1234 567890</span>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="siteFooter"></div>
</body>

</html>
