<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Halcyon</title>

    <link rel="stylesheet" type="text/css" href="css/styles.css">
    <link rel="stylesheet" type="text/css" href="css/styles-nav.css">
    <link rel="stylesheet" type="text/css" href="css/styles-contact.css">

    <link rel="icon" type="image/png" sizes="50x50" href="images/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css?family=Marcellus" rel="stylesheet">
</head>

<body data-page="contact">
    <div id="siteHeader"></div>

    <div class="hero-image">
        <div class="hero-text">
            <h1 style="font-size: 8vw;"> Halcyon </h1>
            <p style="font-size: 2vw;"> Contact us below!! </p>
        </div>
    </div>

    <main class="contact-page">
        <section class="contact-hero">
            <div class="contact-card">
                <p class="eyebrow">Keep in touch</p>
                <h1>Say hello</h1>
                <p class="intro">
                    If you’re looking for gigs, press, or just want to say hi, you can find us here.
                </p>

                <div class="social-links">
                    <a class="social-link" href="https://www.instagram.com/halcyonband/" target="_blank" rel="noreferrer">
                        <i class="fa-brands fa-instagram"></i>
                        <span>Instagram</span>
                    </a>
                    <a class="social-link" href="https://twitter.com/halcyonband" target="_blank" rel="noreferrer">
                        <i class="fa-brands fa-x-twitter"></i>
                        <span>X</span>
                    </a>
                    <a class="social-link" href="https://www.facebook.com/halcyonband" target="_blank" rel="noreferrer">
                        <i class="fa-brands fa-facebook-f"></i>
                        <span>Facebook</span>
                    </a>
                    <a class="social-link" href="https://open.spotify.com/" target="_blank" rel="noreferrer">
                        <i class="fa-brands fa-spotify"></i>
                        <span>Spotify</span>
                    </a>
                    <a class="social-link" href="https://www.ticketmaster.com/" target="_blank" rel="noreferrer">
                        <i class="fa-solid fa-ticket"></i>
                        <span>Tickets</span>
                    </a>
                </div>

                <div class="contact-details">
                    <div class="detail-item">
                        <i class="fa-solid fa-envelope"></i>
                        <a href="mailto:info@halcyonband.com">info@halcyonband.com</a>
                    </div>
                    <div class="detail-item">
                        <i class="fa-solid fa-phone"></i>
                        <a href="tel:+441234567890">+44 1234 567890</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="siteFooter"></div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
